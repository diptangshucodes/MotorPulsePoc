services:
  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  edge-ai:
    build:
      context: ./backend/ai-service
    ports:
      - "8001:8000"
    environment:
      MODEL_DATA_DIR: /data
    volumes:
      - motorpulse-ai-data:/data
    restart: unless-stopped

volumes:
  motorpulse-ai-data:
  mosquitto-data:
