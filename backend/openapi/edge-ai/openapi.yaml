openapi: 3.0.0
info:
  title: MotorPulse Edge AI API
  version: 0.0.0
tags:
  - name: Health
  - name: Edge AI
paths:
  /health:
    get:
      operationId: Health_check
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  service:
                    type: string
                required:
                  - status
                  - service
      tags:
        - Health
  /v1/motors/{motor_id}/analyze:
    post:
      operationId: MotorAnalysis_analyzeWindow
      parameters:
        - name: motor_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnomalyAnalysis'
      tags:
        - Edge AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SensorWindow'
  /v1/motors/{motor_id}/baseline:
    post:
      operationId: MotorAnalysis_learnHealthyBaseline
      parameters:
        - name: motor_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnedBaseline'
      tags:
        - Edge AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HealthyBaselineRequest'
components:
  schemas:
    AccelerationSample:
      type: object
      required:
        - x_m_s2
        - y_m_s2
        - z_m_s2
      properties:
        x_m_s2:
          type: number
          format: double
        y_m_s2:
          type: number
          format: double
        z_m_s2:
          type: number
          format: double
    AnalyzedFeatures:
      type: object
      required:
        - acceleration_vector_rms_m_s2
        - acceleration_peak_to_peak_m_s2
        - dominant_frequency_hz
        - temperature_c
        - current_amps
      properties:
        acceleration_vector_rms_m_s2:
          type: number
          format: double
        acceleration_peak_to_peak_m_s2:
          type: number
          format: double
        dominant_frequency_hz:
          type: number
          format: double
        temperature_c:
          type: number
          format: double
        current_amps:
          type: number
          format: double
    AnomalyAnalysis:
      type: object
      required:
        - motor_id
        - status
        - anomaly_score
        - confidence
        - explanation
        - contributing_feature
        - features
      properties:
        motor_id:
          type: string
        status:
          type: string
          enum:
            - normal
            - warning
            - critical
        anomaly_score:
          type: number
          format: double
        confidence:
          type: string
          enum:
            - baseline
        explanation:
          type: string
        contributing_feature:
          type: string
        features:
          $ref: '#/components/schemas/AnalyzedFeatures'
    HealthyBaselineRequest:
      type: object
      required:
        - windows
      properties:
        windows:
          type: array
          items:
            $ref: '#/components/schemas/SensorWindow'
    LearnedBaseline:
      type: object
      required:
        - motor_id
        - healthy_windows
        - features
        - saved
      properties:
        motor_id:
          type: string
        healthy_windows:
          type: integer
          format: int32
        features:
          type: object
          additionalProperties:
            type: number
            format: double
        saved:
          type: boolean
    SensorWindow:
      type: object
      required:
        - acceleration_samples
        - sample_rate_hz
        - temperature_c
        - current_amps
      properties:
        acceleration_samples:
          type: array
          items:
            $ref: '#/components/schemas/AccelerationSample'
        sample_rate_hz:
          type: number
          format: double
        rpm:
          type: number
          format: double
        temperature_c:
          type: number
          format: double
        current_amps:
          type: number
          format: double
servers:
  - url: http://localhost:8001
    description: Local edge AI service
    variables: {}
